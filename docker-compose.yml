services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youth_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: youth_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: youth_church
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: laravel
    ports:
      - "3306:3306"

  nginx:
    image: nginx:alpine
    container_name: youth_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app